services:
  database:
    image: postgres:18
    env_file: .env
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./server/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 30s
      retries: 10

volumes:
  db_data:
