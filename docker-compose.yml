services:
  database:
    image: postgres:18
    env_file: .env
    ports:
      - "${DB_EXPOSED_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./server/db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 30s
      retries: 10

  backend:
    build: ./server
    command: npm run dev
    env_file: .env
    environment:
      - NODE_ENV=development
      - DB_HOST=database
    ports:
      - "${BACKEND_EXPOSED_PORT:-3001}:${PORT:-3001}"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.PORT||3001)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
