name: E2E

on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: movieapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movieapp"
          --health-interval 5s
          --health-timout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: movieapp
      DB_USER: postgres
      DB_PASSWORD: root
      DB_SSL: 'false'
      SESSION_SECRET: ci-test-secret
      PORT: 3001
      VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load database schema
        run: psql -h 127.0.0.1 -U postgres -d movieapp -f server/db/schema.sql
        env:
          PGPASSWORD: root

      - name: Install and build
        run: |
          npm --prefix server ci
          npm --prefix client ci
          npm --prefix client run build

      - name: Start server
        run: |
          node server/src/index.js &
          npx --yes wait-on http://127.0.0.1:3001/api/health

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3001

      - name: Save Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
