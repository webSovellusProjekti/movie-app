name: tests

on:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: movieapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movieapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: movieapp
      DB_USER: postgres
      DB_PASSWORD: root
      DB_SSL: 'false'
      SESSION_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Load database schema
        run: psql -h 127.0.0.1 -U postgres -d movieapp -f server/db/schema.sql
        env:
          PGPASSWORD: root

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run API tests
        run: npm test
        working-directory: server
